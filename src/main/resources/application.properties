spring.application.name=viagens

# PostgreSQL. Os valores podem ser sobrescritos por variáveis de ambiente.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/viagens_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# API
server.port=${SERVER_PORT:8081}
server.error.include-message=never
server.error.include-binding-errors=never

# Carga acadêmica de usuários e destinos de demonstração.
app.seed.enabled=${APP_SEED_ENABLED:true}
