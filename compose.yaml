services:
  postgres:
    image: postgres:16-alpine
    container_name: viagens-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: viagens_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - viagens_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d viagens_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  viagens_postgres_data:
